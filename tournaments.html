<div class="tab-content directory-page">
  <div class="directory-header"><div><div class="section-eyebrow">COMPETITIVE / EVENTS</div><h2>Turnuvalar</h2><p>Turnuva takvimi ve katılım kayıtları tüm cihazlarda aynı Supabase veritabanından yüklenir.</p></div><span class="local-data-badge">Çevrim içi etkinlikler</span></div>
  <form id="tournament-form" class="editor-form" hidden>
    <h3>Yönetici · turnuva oluştur</h3>
    <div class="form-grid">
      <label>Turnuva adı<input id="tournament-title" maxlength="100" minlength="3" required placeholder="Etkinlik adı"></label>
      <label>Başlangıç zamanı<input id="tournament-date" type="datetime-local" required></label>
      <label>Format<select id="tournament-format"><option>3v3</option><option>2v2</option><option>1v1</option><option>Özel format</option></select></label>
      <label>Katılımcı limiti<input id="tournament-capacity" type="number" min="2" max="512" value="16" required></label>
      <label>Kayıt durumu<select id="tournament-registration"><option value="true">Kayıt açık</option><option value="false">Kayıt kapalı</option></select></label>
    </div>
    <button type="submit" class="primary-action">Çevrim içi turnuva oluştur</button>
  </form>
  <div id="tournament-status-message" class="form-status" role="status"></div>
  <div class="directory-toolbar"><h3>Etkinlik takvimi <span id="tournament-total" class="count-pill">0</span></h3><select id="tournament-filter" aria-label="Turnuva filtresi"><option value="all">Tüm turnuvalar</option><option value="upcoming">Yaklaşan</option><option value="past">Geçmiş</option></select></div>
  <div id="tournaments-list" class="directory-grid"></div>
</div>
<script>
  let cloudTournaments = [], cloudParticipants = [], cloudTournamentUser = null, cloudTournamentRole = 'member';
  let cloudTournamentTimer = null, cloudTournamentDisposed = false, cloudTournamentBusy = '';
  const tournamentMessage = text => { const el=document.getElementById('tournament-status-message'); if(el) el.textContent=text||''; };
  function renderTournaments() {
    const container=document.getElementById('tournaments-list'); if(!container) return;
    const filter=document.getElementById('tournament-filter').value, now=Date.now();
    const filtered=cloudTournaments.filter(item=>{const past=item.starts_at&&new Date(item.starts_at).getTime()<now;return filter==='all'||(filter==='past'?past:!past);});
    document.getElementById('tournament-total').textContent=String(filtered.length);
    container.replaceChildren();
    if(!filtered.length){const empty=document.createElement('div');empty.className='directory-empty';const strong=document.createElement('strong');strong.textContent='Bu filtrede turnuva bulunamadı.';const p=document.createElement('p');p.textContent=cloudTournamentRole==='member'?'Yeni turnuvalar yayınlandığında burada görünür.':'Yönetici formundan çevrim içi turnuva oluşturabilirsin.';empty.append(strong,p);container.appendChild(empty);return;}
    filtered.forEach(item=>{
      const card=document.createElement('article');card.className='directory-card tournament-record';
      const top=document.createElement('div');top.className='directory-card-top';
      const mark=document.createElement('div');mark.className='team-mark';mark.textContent=String(item.description||'Rocket League').match(/Format:\s*([^\n]+)/i)?.[1]||'RL';
      const status=document.createElement('span');status.className='rank-pill';status.textContent=item.status==='live'?'Canlı':item.status==='completed'?'Tamamlandı':item.status==='cancelled'?'İptal':item.registration_open?'Kayıt açık':'Kayıt kapalı';top.append(mark,status);
      const title=document.createElement('h3');title.textContent=item.name;
      const description=document.createElement('p');description.textContent=item.description||'Turnuva detayları henüz eklenmedi.';
      const date=document.createElement('p');date.textContent=item.starts_at?new Date(item.starts_at).toLocaleString('tr-TR'):'Başlangıç zamanı belirtilmedi';
      const rows=cloudParticipants.filter(row=>row.tournament_id===item.id), joined=rows.some(row=>row.user_id===cloudTournamentUser?.id);
      const count=document.createElement('p');count.textContent=rows.length+' / '+item.max_participants+' katılımcı';
      const actions=document.createElement('div');actions.className='tournament-actions';
      const join=document.createElement('button');join.type='button';join.className='primary-action';join.textContent=cloudTournamentBusy===item.id?'İşleniyor…':joined?'Katılımı iptal et':'Turnuvaya kaydol';
      const past=item.starts_at&&new Date(item.starts_at).getTime()<now;
      join.disabled=!cloudTournamentUser||cloudTournamentBusy===item.id||item.status!=='upcoming'||!item.registration_open||Boolean(past)||(!joined&&rows.length>=item.max_participants);
      join.addEventListener('click',()=>toggleTournament(item,joined));
      actions.appendChild(join);
      if(['owner','admin'].includes(cloudTournamentRole)){
        const remove=document.createElement('button');remove.type='button';remove.className='danger-action';remove.textContent='Turnuvayı sil';remove.addEventListener('click',()=>deleteTournament(item));actions.appendChild(remove);
      }
      card.append(top,title,description,date,count,actions);container.appendChild(card);
    });
  }
  async function loadTournaments() {
    try{
      const user=await window.apexCloud.getCurrentUser();if(!user){window.location.replace('login.html');return;}
      cloudTournamentUser=user;cloudTournamentRole=await window.apexCloud.getRole(user.id);
      document.getElementById('tournament-form').hidden=!['owner','admin'].includes(cloudTournamentRole);
      const [events,participants]=await Promise.all([
        window.apexCloud.select('tournaments','select=id,name,description,status,starts_at,max_participants,created_by,registration_open&order=starts_at.asc.nullslast&limit=200'),
        window.apexCloud.select('tournament_participants','select=tournament_id,user_id,registered_at&limit=2000')
      ]);
      if(cloudTournamentDisposed)return;
      cloudTournaments=Array.isArray(events)?events:[];cloudParticipants=Array.isArray(participants)?participants:[];
      tournamentMessage('Turnuva ve katılım verileri çevrim içi eşitlendi.');renderTournaments();
    }catch(error){tournamentMessage('Turnuvalar yüklenemedi: '+(error.message||'Bağlantı hatası'));}
  }
  async function toggleTournament(item,joined){
    cloudTournamentBusy=item.id;tournamentMessage('Katılım kaydı güncelleniyor…');renderTournaments();
    try{
      if(joined) await window.apexCloud.remove('tournament_participants','tournament_id=eq.'+encodeURIComponent(item.id)+'&user_id=eq.'+encodeURIComponent(cloudTournamentUser.id));
      else await window.apexCloud.insert('tournament_participants',[{tournament_id:item.id,user_id:cloudTournamentUser.id}]);
      await loadTournaments();tournamentMessage(joined?'Turnuva kaydın iptal edildi.':'Turnuvaya kaydın tamamlandı.');
    }catch(error){tournamentMessage('Katılım güncellenemedi: '+(error.message||'Bağlantı hatası'));}
    finally{cloudTournamentBusy='';renderTournaments();}
  }
  async function deleteTournament(item){
    if(!confirm('“'+item.name+'” turnuvasını çevrim içi veritabanından silmek istiyor musun?'))return;
    try{await window.apexCloud.remove('tournaments','id=eq.'+encodeURIComponent(item.id));await loadTournaments();tournamentMessage('Turnuva silindi.');}
    catch(error){tournamentMessage('Turnuva silinemedi: '+(error.message||'Yetki hatası'));}
  }
  document.getElementById('tournament-form').addEventListener('submit',async event=>{
    event.preventDefault();if(!['owner','admin'].includes(cloudTournamentRole)||!cloudTournamentUser){tournamentMessage('Bu işlem için Admin veya Owner yetkisi gerekir.');return;}
    const name=document.getElementById('tournament-title').value.trim(),date=new Date(document.getElementById('tournament-date').value),capacity=Number(document.getElementById('tournament-capacity').value),format=document.getElementById('tournament-format').value,registration=document.getElementById('tournament-registration').value==='true';
    if(name.length<3||Number.isNaN(date.getTime())||date.getTime()<=Date.now()||!Number.isInteger(capacity)||capacity<2||capacity>512){tournamentMessage('Ad, gelecekte bir başlangıç zamanı ve 2–512 arası katılımcı limiti gerekli.');return;}
    const button=event.currentTarget.querySelector('button[type=submit]');button.disabled=true;tournamentMessage('Turnuva oluşturuluyor…');
    try{await window.apexCloud.insert('tournaments',[{name,description:'Format: '+format,status:'upcoming',starts_at:date.toISOString(),max_participants:capacity,created_by:cloudTournamentUser.id,registration_open:registration}]);event.currentTarget.reset();document.getElementById('tournament-capacity').value='16';await loadTournaments();tournamentMessage('Turnuva çevrim içi olarak oluşturuldu.');}
    catch(error){tournamentMessage('Turnuva oluşturulamadı: '+(error.message||'Yetki hatası'));}
    finally{button.disabled=false;}
  });
  document.getElementById('tournament-filter').addEventListener('change',renderTournaments);
  window.apexTabCleanup=()=>{cloudTournamentDisposed=true;if(cloudTournamentTimer)clearInterval(cloudTournamentTimer);cloudTournamentTimer=null;};
  loadTournaments().then(()=>{if(!cloudTournamentDisposed)cloudTournamentTimer=setInterval(loadTournaments,15000);});
</script>
<style>
.directory-page{min-width:0}.directory-header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.directory-header p{color:#9eafaa;margin-top:6px}.local-data-badge{display:inline-flex;border:1px solid #34423e;border-radius:999px;color:#a5b5b0;padding:6px 10px;font-size:.72rem;white-space:nowrap}.editor-form{margin:16px 0;padding:22px;border:1px solid #293531;border-radius:12px;background:#151a19}.editor-form[hidden]{display:none}.editor-form h3{color:#eaf3ef;margin-bottom:16px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}.form-grid label{color:#9eafaa;display:grid;gap:7px;font-size:.82rem}.form-grid input,.form-grid select{width:100%;min-width:0;border:1px solid #34413d;border-radius:7px;background:#0c100f;color:#edf5f1;padding:11px}.primary-action,.danger-action{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:800}.primary-action{background:var(--primary-color);color:#07110f}.primary-action:disabled{opacity:.45;cursor:not-allowed}.danger-action{background:#43211e;color:#ffc1b9}.form-status{color:#91d8c5;font-size:.82rem;min-height:1.2em}.directory-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:22px 0 14px}.directory-toolbar h3{color:#eaf3ef}.directory-toolbar select{border:1px solid #34413d;border-radius:8px;background:#0c100f;color:#edf5f1;padding:10px 12px}.count-pill,.rank-pill{border-radius:999px;background:#1d3029;color:#9fe5cb;padding:5px 9px;font-size:.72rem;font-weight:800}.directory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.directory-card{min-width:0;padding:18px;border:1px solid #293833;border-radius:12px;background:linear-gradient(150deg,#171e1b,#101412)}.directory-card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.team-mark{display:grid;place-items:center;min-width:42px;height:42px;padding:0 8px;border-radius:9px;background:#243d33;color:#b3f5d9;font-weight:900}.directory-card h3{color:#f0f6f3;font-size:1.05rem;overflow-wrap:anywhere}.directory-card p{color:#9eafaa;font-size:.82rem;margin-top:8px;overflow-wrap:anywhere}.tournament-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.directory-empty{grid-column:1/-1;border:1px dashed #34443d;border-radius:12px;padding:26px;text-align:center;color:#a8b8b0}.directory-empty p{margin-top:7px}@media(max-width:700px){.directory-grid{grid-template-columns:1fr}.directory-header,.directory-toolbar{align-items:stretch;flex-direction:column}.form-grid{grid-template-columns:1fr}}
</style>
