<div class="tab-content support-page">
  <div class="support-header"><div><div class="section-eyebrow">APEX GENESIS HELP DESK</div><h2>Destek Merkezi</h2><p>Ticket aç, destek ekibiyle güvenli şekilde yazış ve rank doğrulama talebi oluştur.</p></div><span class="support-live"><i></i> Canlı destek</span></div>
  <div id="support-status" class="support-status" role="status" aria-live="polite">Destek kuyruğu yükleniyor…</div>
  <div class="support-layout">
    <section class="support-panel"><h3>Yeni destek talebi</h3><form id="support-create-form" class="support-form">
      <label>Konu<input id="support-subject" required minlength="3" maxlength="140" placeholder="Kısaca sorunun nedir?"></label>
      <label>Kategori<select id="support-category"><option value="general">Genel destek</option><option value="rank_verification">Rank doğrulama</option><option value="account">Hesap sorunu</option><option value="bug_report">Hata bildirimi</option><option value="other">Diğer</option></select></label>
      <label>Mesaj<textarea id="support-first-message" required minlength="5" maxlength="5000" rows="4" placeholder="Detayları yaz. Rank doğrulama için Rocket League profilini ve gerekli kanıt bağlantılarını belirt."></textarea></label>
      <button class="primary-action" id="support-create" type="submit">Ticket oluştur</button>
    </form></section>
    <section class="support-panel"><div class="support-list-head"><h3 id="support-ticket-heading">Taleplerim</h3><button id="support-refresh" type="button" class="support-secondary">Yenile</button></div><div id="support-ticket-list" class="support-ticket-list"></div></section>
  </div>
  <section class="support-panel support-thread"><div class="support-list-head"><div><h3 id="support-thread-title">Bir talep seç</h3><p id="support-thread-meta">Mesajları görüntülemek için soldaki listeden bir talep seç.</p></div><div id="support-staff-status"></div></div><div id="support-messages" class="support-messages"></div><form id="support-reply-form" class="support-reply-form"><textarea id="support-reply" required minlength="1" maxlength="5000" rows="3" placeholder="Yanıtını yaz…" disabled></textarea><button type="submit" id="support-reply-button" disabled>Gönder</button></form></section>
</div>
<script>
(async function initSupportDesk(){
  const api = window.apexCloud;
  const byId = id => document.getElementById(id);
  const status = byId('support-status');
  const ticketList = byId('support-ticket-list');
  const messagesBox = byId('support-messages');
  let user = null, role = 'member', tickets = [], activeTicket = null, busy = false, polling = null, disposed = false;
  window.apexTabCleanup = () => { disposed = true; if (polling) clearInterval(polling); };
  const staff = () => role === 'admin' || role === 'owner';
  const safe = value => String(value ?? '');
  function setStatus(text, isError=false){ status.textContent=text; status.classList.toggle('is-error',isError); }
  function node(tag, cls, text){ const el=document.createElement(tag); if(cls)el.className=cls; if(text!==undefined)el.textContent=text; return el; }
  function fmt(value){ const d=new Date(value); return Number.isNaN(d.getTime())?'':d.toLocaleString('tr-TR',{dateStyle:'short',timeStyle:'short'}); }
  async function loadTickets(keepSelection=true){
    if(!user) return;
    const rows = await api.select('support_tickets','select=id,user_id,subject,category,status,priority,assigned_to,created_at,updated_at&order=updated_at.desc&limit=100');
    tickets = Array.isArray(rows) ? rows : [];
    byId('support-ticket-heading').textContent = staff() ? 'Canlı destek kuyruğu' : 'Taleplerim';
    ticketList.replaceChildren();
    if(!tickets.length) ticketList.append(node('p','support-empty','Henüz destek talebi yok.'));
    tickets.forEach(ticket=>{
      const button=node('button','support-ticket'+(activeTicket?.id===ticket.id?' is-active':'')); button.type='button';
      const top=node('span','support-ticket-top'); top.append(node('strong','',ticket.subject),node('small','support-status-pill status-'+ticket.status,ticket.status.replace('_',' ')));
      const meta=node('span','support-ticket-meta',ticket.category.replace('_',' ')+' · '+fmt(ticket.updated_at));
      button.append(top,meta); button.addEventListener('click',()=>openTicket(ticket)); ticketList.append(button);
    });
    if(keepSelection && activeTicket){ const fresh=tickets.find(t=>t.id===activeTicket.id); if(fresh){ activeTicket=fresh; await loadMessages(false); } else { activeTicket=null; clearThread(); } }
  }
  function clearThread(){ byId('support-thread-title').textContent='Bir talep seç';byId('support-thread-meta').textContent='Mesajları görüntülemek için listeden bir talep seç.';messagesBox.replaceChildren();byId('support-reply').disabled=true;byId('support-reply-button').disabled=true;byId('support-staff-status').replaceChildren(); }
  async function openTicket(ticket){ activeTicket=ticket; byId('support-thread-title').textContent=ticket.subject;byId('support-thread-meta').textContent=ticket.category.replace('_',' ')+' · '+ticket.status.replace('_',' ')+' · '+fmt(ticket.created_at);byId('support-reply').disabled=false;byId('support-reply-button').disabled=false;byId('support-staff-status').replaceChildren(); if(staff()){const select=node('select','support-status-select');select.setAttribute('aria-label','Ticket durumu');['open','in_progress','waiting_user','resolved','closed'].forEach(s=>{const o=node('option','',s.replace('_',' '));o.value=s;select.append(o)});select.value=ticket.status;select.addEventListener('change',async()=>{try{await api.update('support_tickets','id=eq.'+encodeURIComponent(ticket.id),{status:select.value,assigned_to:user.id});await loadTickets();setStatus('Ticket durumu güncellendi.')}catch(e){setStatus(e.message,true)}});byId('support-staff-status').append(select)}await loadMessages(); }
  async function loadMessages(scroll=true){ if(!activeTicket)return; const rows=await api.select('support_messages','select=id,ticket_id,sender_id,body,is_staff,created_at&ticket_id=eq.'+encodeURIComponent(activeTicket.id)+'&order=created_at.asc&limit=300'); if(!Array.isArray(rows))return; messagesBox.replaceChildren(); if(!rows.length)messagesBox.append(node('p','support-empty','İlk mesajı göndererek görüşmeyi başlat.')); rows.forEach(message=>{const bubble=node('article','support-message'+(message.is_staff?' staff-message':'')+(message.sender_id===user.id?' own-message':''));const head=node('header','support-message-head',message.is_staff?'Apex Genesis Support':message.sender_id===user.id?'Sen':'Üye');head.append(node('time','',fmt(message.created_at)));bubble.append(head,node('p','',message.body));messagesBox.append(bubble)});if(scroll)messagesBox.scrollTop=messagesBox.scrollHeight; }
  byId('support-create-form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;byId('support-create').disabled=true;try{const [subject,category,body]=[byId('support-subject').value.trim(),byId('support-category').value,byId('support-first-message').value.trim()];const rows=await api.insert('support_tickets',{user_id:user.id,subject,category});if(!Array.isArray(rows)||!rows[0])throw new Error('Ticket oluşturulamadı. Migration ve RLS ayarlarını kontrol et.');const ticket=rows[0];await api.insert('support_messages',{ticket_id:ticket.id,sender_id:user.id,body,is_staff:false});byId('support-create-form').reset();await loadTickets(false);const fresh=tickets.find(t=>t.id===ticket.id)||ticket;await openTicket(fresh);setStatus('Destek talebin oluşturuldu. Yanıtlar otomatik yenilenir.')}catch(e){setStatus(e.message||'Ticket oluşturulamadı.',true)}finally{busy=false;byId('support-create').disabled=false;}});
  byId('support-reply-form').addEventListener('submit',async e=>{e.preventDefault();if(!activeTicket||busy)return;const body=byId('support-reply').value.trim();if(!body)return;busy=true;byId('support-reply-button').disabled=true;try{await api.insert('support_messages',{ticket_id:activeTicket.id,sender_id:user.id,body,is_staff:staff()});byId('support-reply').value='';await loadMessages();await loadTickets();setStatus('Mesaj gönderildi.')}catch(e){setStatus(e.message||'Mesaj gönderilemedi.',true)}finally{busy=false;byId('support-reply-button').disabled=!activeTicket;}});
  byId('support-refresh').addEventListener('click',()=>loadTickets().catch(e=>setStatus(e.message,true)));
  try{user=await api.getCurrentUser();if(!user)throw new Error('Önce giriş yapmalısın.');role=await api.getRole(user.id);await loadTickets(false);if(disposed)return;setStatus(staff()?'Destek kuyruğu canlı güncelleniyor.':'Destek taleplerin canlı güncelleniyor.');polling=setInterval(()=>{if(!document.getElementById('support-ticket-list')){clearInterval(polling);return;}loadTickets().catch(e=>console.warn('Support polling failed',e));},7000);}catch(e){setStatus(e.message||'Destek servisine bağlanılamadı.',true);}
})();
</script>
<style>
.support-page{display:block}.support-header,.support-list-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.support-header p{color:#9eafaa;max-width:720px;line-height:1.6}.support-live{display:flex;align-items:center;gap:8px;border:1px solid #235e47;border-radius:999px;padding:8px 12px;color:#7ce2b1;font-size:.8rem;white-space:nowrap}.support-live i{width:7px;height:7px;border-radius:50%;background:#4fe19b;box-shadow:0 0 12px #4fe19b}.support-status{margin:16px 0;padding:12px 14px;border:1px solid #28463a;background:#12231c;color:#a8e4c4;border-radius:8px}.support-status.is-error{border-color:#713c3c;background:#2a1717;color:#ffc1c1}.support-layout{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(300px,1.2fr);gap:16px}.support-panel{min-width:0;padding:18px;border:1px solid #293a33;border-radius:12px;background:#121916}.support-panel h3{margin:0 0 14px;color:#eaf5ef}.support-form,.support-form label{display:grid;gap:8px}.support-form{gap:13px}.support-form label{font-size:.82rem;color:#9eafaa}.support-form input,.support-form select,.support-form textarea,.support-reply-form textarea,.support-status-select{width:100%;border:1px solid #34483e;border-radius:7px;background:#0b100e;color:#eff8f3;padding:10px;font:inherit}.support-form .primary-action{justify-self:start}.support-secondary{border:1px solid #3b4c43;border-radius:7px;background:#18221d;color:#dce9e1;padding:8px 10px;cursor:pointer}.support-ticket-list{display:grid;gap:8px;max-height:420px;overflow:auto}.support-ticket{width:100%;text-align:left;border:1px solid #2c3c34;border-radius:8px;background:#0d1310;color:#eaf5ef;padding:12px;cursor:pointer}.support-ticket.is-active{border-color:var(--primary-color);background:#18251f}.support-ticket-top,.support-ticket-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}.support-ticket-top strong{overflow-wrap:anywhere}.support-ticket-meta{display:block;margin-top:7px;color:#8ca198;font-size:.75rem}.support-status-pill{border-radius:999px;background:#25372e;padding:4px 7px;color:#a9e7c3;font-size:.68rem;white-space:nowrap}.status-resolved,.status-closed{color:#b6c1bd;background:#303b36}.support-thread{margin-top:16px}.support-thread #support-thread-meta{margin-top:5px;color:#8fa198;font-size:.8rem}.support-messages{display:flex;flex-direction:column;gap:10px;min-height:120px;max-height:380px;overflow:auto;padding:12px 2px}.support-message{align-self:flex-start;max-width:min(85%,760px);padding:12px 14px;border:1px solid #2b3c33;border-radius:10px;background:#17211b}.support-message.own-message{align-self:flex-end;background:#172c24;border-color:#2b5944}.support-message.staff-message{border-left:3px solid var(--primary-color)}.support-message-head{display:flex;justify-content:space-between;gap:16px;color:#7fdfac;font-size:.76rem;font-weight:700}.support-message-head time{color:#809188;font-weight:400}.support-message p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;margin-top:7px}.support-reply-form{display:flex;align-items:flex-end;gap:10px}.support-reply-form textarea{flex:1}.support-reply-form button{border:0;border-radius:7px;background:var(--primary-color);color:#07110d;padding:12px 18px;font-weight:800;cursor:pointer}.support-reply-form button:disabled{opacity:.45;cursor:not-allowed}.support-empty{padding:18px;text-align:center;color:#83958b;font-size:.85rem}.support-status-select{width:auto}.support-thread #support-staff-status{display:flex;gap:8px}@media(max-width:850px){.support-layout{grid-template-columns:1fr}.support-header{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.support-panel{padding:12px}.support-reply-form{align-items:stretch;flex-direction:column}.support-reply-form button{align-self:flex-end}.support-message{max-width:95%}}
