<div class="tab-content directory-page">
    <div class="directory-header"><div><div class="section-eyebrow">COMMUNITY / ROSTERS</div><h2>Takımlar</h2><p>Takım kayıtlarını oluştur ve bu cihazda yönet. Bu kayıtlar şu an çevrimdışı yereldir.</p></div><span class="local-data-badge">Yerel kayıtlar</span></div>
    <form id="team-form" class="editor-form">
        <h3>Yeni takım kaydı</h3>
        <div class="form-grid"><label>Takım adı<input id="team-name" maxlength="48" required placeholder="Örn. Apex Genesis"></label><label>Bölge<select id="team-region"><option>EU</option><option>NA</option><option>ME</option><option>OCE</option><option>SAM</option><option>APAC</option></select></label><label>Takım rengi<input id="team-color" type="color" value="#00ffcc"></label><label>Açıklama<input id="team-description" maxlength="160" placeholder="Takım hakkında kısa bilgi"></label></div>
        <button type="submit" class="primary-action">Takım oluştur</button><p id="team-form-status" class="form-status" role="status"></p>
    </form>
    <div class="directory-toolbar"><h3>Takım dizini <span id="team-total" class="count-pill">0</span></h3><input id="team-search" type="search" placeholder="Takım ara…" aria-label="Takım ara"></div>
    <div id="teams-list" class="directory-grid"></div>
</div>
<script>
    const TEAM_KEY = 'apexGenesisTeams';
    let teamsData = [];
    function readTeams() {
        try {
            const saved = JSON.parse(localStorage.getItem(TEAM_KEY) || '[]');
            return Array.isArray(saved) ? saved : [];
        } catch { return []; }
    }
    function saveTeams() { localStorage.setItem(TEAM_KEY, JSON.stringify(teamsData)); }
    function renderTeams() {
        const container = document.getElementById('teams-list');
        const query = document.getElementById('team-search').value.trim().toLowerCase();
        const filtered = teamsData.filter(team => [team.name, team.region, team.description].join(' ').toLowerCase().includes(query));
        document.getElementById('team-total').textContent = filtered.length;
        container.replaceChildren();
        if (!filtered.length) {
            const empty = document.createElement('div'); empty.className = 'directory-empty';
            empty.innerHTML = '<strong>Bu aramayla eşleşen takım yok.</strong><p>İlk takımını yukarıdaki formdan ekleyebilirsin.</p>';
            container.appendChild(empty); return;
        }
        filtered.forEach(team => {
            const card = document.createElement('article'); card.className = 'directory-card';
            const top = document.createElement('div'); top.className = 'directory-card-top';
            const mark = document.createElement('div'); mark.className = 'team-mark'; mark.style.setProperty('--team-color', /^#[0-9a-f]{6}$/i.test(team.color || '') ? team.color : '#00ffcc'); mark.textContent = String(team.name || 'AG').split(/\s+/).map(part => part[0]).join('').slice(0,3).toUpperCase();
            const region = document.createElement('span'); region.className = 'rank-pill'; region.textContent = team.region || 'Bölge belirtilmedi';
            top.append(mark, region);
            const title = document.createElement('h3'); title.textContent = team.name;
            const desc = document.createElement('p'); desc.textContent = team.description || 'Takım açıklaması eklenmedi.';
            const meta = document.createElement('div'); meta.className = 'directory-meta'; meta.textContent = 'Oluşturulma: ' + new Date(team.createdAt || Date.now()).toLocaleDateString('tr-TR');
            const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'danger-action'; remove.textContent = 'Takımı sil'; remove.addEventListener('click', () => {
                if (!confirm('“' + team.name + '” takım kaydını bu cihazdan silmek istiyor musun?')) return;
                teamsData = teamsData.filter(item => item.id !== team.id); saveTeams(); renderTeams();
            });
            card.append(top, title, desc, meta, remove); container.appendChild(card);
        });
    }
    document.getElementById('team-form').addEventListener('submit', event => {
        event.preventDefault();
        const name = document.getElementById('team-name').value.trim();
        if (name.length < 2) { document.getElementById('team-form-status').textContent = 'Takım adı en az 2 karakter olmalı.'; return; }
        if (teamsData.some(team => team.name.toLowerCase() === name.toLowerCase())) { document.getElementById('team-form-status').textContent = 'Bu takım adı zaten kayıtlı.'; return; }
        teamsData.unshift({ id: crypto.randomUUID(), name, region: document.getElementById('team-region').value, color: document.getElementById('team-color').value, description: document.getElementById('team-description').value.trim(), createdAt: new Date().toISOString() });
        saveTeams(); renderTeams(); event.target.reset(); document.getElementById('team-color').value = '#00ffcc'; document.getElementById('team-form-status').textContent = 'Takım bu cihazda kaydedildi.';
    });
    document.getElementById('team-search').addEventListener('input', renderTeams);
    teamsData = readTeams(); renderTeams();
</script>
<style>
    .directory-page { display:block; padding:0; }
    .directory-header { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:22px; }
    .directory-header p { color:#9eafaa; line-height:1.6; }
    .local-data-badge,.rank-pill,.count-pill { display:inline-flex; border:1px solid #34423e; border-radius:999px; color:#a5b5b0; padding:6px 10px; font-size:.72rem; white-space:nowrap; }
    .editor-form { background:linear-gradient(145deg,#171e1c,#121615); border:1px solid #293531; border-radius:12px; padding:22px; margin-bottom:26px; }
    .editor-form h3,.directory-toolbar h3 { color:#eaf3ef; margin-bottom:16px; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-bottom:18px; }
    .form-grid label { color:#9eafaa; display:grid; gap:7px; font-size:.82rem; }
    .form-grid input,.form-grid select { width:100%; min-width:0; border:1px solid #34413d; border-radius:7px; background:#0c100f; color:#edf5f1; padding:11px; }
    .form-grid input[type=color] { height:40px; padding:4px; }
    .primary-action,.danger-action { border:0; border-radius:7px; padding:10px 14px; cursor:pointer; font-weight:800; }
    .primary-action { background:var(--primary-color); color:#07110f; }
    .danger-action { margin-top:14px; background:#2a1918; color:#ffaaa0; border:1px solid #57312d; }
    .form-status { display:inline-block; margin-left:12px; color:#91d8c5; font-size:.82rem; }
    .directory-toolbar { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:14px; }
    .directory-toolbar h3 { margin:0; }
    .directory-toolbar input { width:min(300px,100%); background:#101514; color:#edf5f1; border:1px solid #2c3935; border-radius:8px; padding:11px 13px; }
    .directory-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .directory-card { min-width:0; padding:20px; border-radius:12px; background:linear-gradient(145deg,#1a2220,#131716); border:1px solid #28322f; }
    .directory-card-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:18px; }
    .team-mark { width:52px; height:52px; display:flex; align-items:center; justify-content:center; border:1px solid color-mix(in srgb,var(--team-color) 55%,transparent); border-radius:12px; background:color-mix(in srgb,var(--team-color) 12%,#111); color:var(--team-color); font:800 .9rem Orbitron,monospace; }
    .directory-card h3 { color:#edf5f2; margin-bottom:9px; overflow-wrap:anywhere; }
    .directory-card p { color:#a1b0ab; font-size:.88rem; line-height:1.6; }
    .directory-meta { color:#71817b; font-size:.75rem; margin-top:14px; }
    .directory-empty { grid-column:1/-1; padding:28px; border:1px dashed #35433e; border-radius:12px; color:#a3b1ac; }
    .directory-empty strong { color:#e7f0ec; }
    .directory-empty p { margin-top:8px; }
    @media(max-width:1000px) { .directory-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media(max-width:650px) { .form-grid,.directory-grid { grid-template-columns:1fr; } .directory-header,.directory-toolbar { align-items:flex-start; flex-direction:column; } .form-status { display:block; margin:12px 0 0; } }
</style>
