<div class="tab-content teams-page">
  <div class="section-eyebrow">SQUADS & ESPORTS</div><h2>Takımlar</h2><p class="teams-intro">Takımları tüm cihazlarda ortak veritabanında görüntüle. Takım oluşturma yalnızca Admin ve Owner hesaplarına açıktır.</p>
  <form id="cloud-team-form" class="teams-create" hidden><label>Takım adı<input id="cloud-team-name" required minlength="2" maxlength="50" placeholder="Apex Genesis"></label><label>Etiket<input id="cloud-team-tag" maxlength="8" placeholder="APX"></label><label>Açıklama<textarea id="cloud-team-description" maxlength="1000" rows="3" placeholder="Takım hakkında"></textarea></label><button type="submit">Çevrim içi takım oluştur</button></form>
  <div id="cloud-team-status" role="status" class="teams-status">Takımlar yükleniyor…</div><div id="cloud-team-grid" class="teams-grid"></div>
</div>
<script>
(async function initCloudTeams(){
 const api=window.apexCloud, byId=id=>document.getElementById(id);let user=null,role='member',busy=false;
 const status=(text,bad=false)=>{const el=byId('cloud-team-status');el.textContent=text;el.classList.toggle('is-error',bad)};
 const node=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el};
 async function load(){
  const [rows,members]=await Promise.all([
   api.select('teams','select=id,name,tag,description,owner_id,is_public,created_at&order=created_at.desc&limit=100'),
   api.select('team_members','select=team_id&user_id=eq.'+encodeURIComponent(user.id))
  ]);
  if(!Array.isArray(rows)||!Array.isArray(members))throw new Error('Takım verisi okunamadı.');
  const joined=new Set(members.map(item=>item.team_id)),grid=byId('cloud-team-grid');grid.replaceChildren();
  if(!rows.length)grid.append(node('p','teams-empty','Henüz çevrim içi takım yok.'));
  rows.forEach(team=>{
   const card=node('article','team-card');const header=node('div','team-card-header');const details=node('div','');
   details.append(node('span','team-tag',team.tag||'TEAM'),node('h3','',team.name));
   header.append(details,node('span','team-membership',team.owner_id===user.id?'Sahibi':joined.has(team.id)?'Üyesin':'Açık takım'));
   card.append(header,node('p','team-description',team.description||'Açıklama eklenmemiş.'));
   if(team.owner_id!==user.id){const btn=node('button','team-join-btn',joined.has(team.id)?'Takımdan ayrıl':'Takıma katıl');btn.type='button';btn.disabled=busy;btn.addEventListener('click',async()=>{if(busy)return;busy=true;try{if(joined.has(team.id))await api.remove('team_members','team_id=eq.'+encodeURIComponent(team.id)+'&user_id=eq.'+encodeURIComponent(user.id));else await api.insert('team_members',{team_id:team.id,user_id:user.id});status('Üyelik güncellendi.');await load()}catch(e){status(e.message||'Üyelik güncellenemedi.',true)}finally{busy=false}});card.append(btn)}
   grid.append(card);
  });
 }
 try{
  user=await api.getCurrentUser();if(!user)throw new Error('Oturum bulunamadı.');
  role=await api.getRole(user.id);byId('cloud-team-form').hidden=!(role==='admin'||role==='owner');
  byId('cloud-team-form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;const button=e.currentTarget.querySelector('button');button.disabled=true;try{const result=await api.insert('teams',{name:byId('cloud-team-name').value.trim(),tag:byId('cloud-team-tag').value.trim().toUpperCase(),description:byId('cloud-team-description').value.trim(),owner_id:user.id,is_public:true});if(!Array.isArray(result)||!result.length)throw new Error('Takım oluşturulamadı.');e.currentTarget.reset();status('Takım oluşturuldu ve çevrim içi yayınlandı.');await load()}catch(e){status(e.message||'Takım oluşturulamadı.',true)}finally{busy=false;button.disabled=false}});
  await load();status(role==='member'?'Takımlar yüklendi. Yeni takım oluşturmak için Admin veya Owner gerekir.':'Takımlar çevrim içi olarak güncellendi.');
 }catch(e){status(e.message||'Takımlar yüklenemedi. Migration ve bağlantıyı kontrol et.',true)}
})();
</script>
<style>
.teams-page{display:block}.teams-intro{color:#9eafaa;line-height:1.65;margin:8px 0 20px}.teams-create{display:grid;gap:12px;padding:18px;margin:18px 0;border:1px solid #2c4036;border-radius:12px;background:#121a16}.teams-create[hidden]{display:none}.teams-create label{display:grid;gap:6px;color:#a7b9b0;font-size:.82rem}.teams-create input,.teams-create textarea{width:100%;padding:11px;border:1px solid #33483d;border-radius:7px;background:#0a100d;color:#edf8f2}.teams-create button,.team-join-btn{justify-self:start;padding:10px 14px;border:0;border-radius:7px;background:var(--primary-color);color:#07110d;font-weight:800;cursor:pointer}.teams-status{padding:10px 12px;margin:14px 0;border-radius:8px;background:#13221a;color:#a9e8c4}.teams-status.is-error{background:#2b1717;color:#ffc1c1}.teams-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.team-card{padding:18px;border:1px solid #293a32;border-radius:12px;background:linear-gradient(145deg,#18221c,#101613);min-width:0}.team-card-header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.team-tag{color:var(--primary-color);font-size:.7rem;letter-spacing:.15em;font-weight:800}.team-card h3{font-size:1.2rem;font-weight:800;color:#edf8f2;margin-top:6px;overflow-wrap:anywhere}.team-membership{font-size:.7rem;border:1px solid #31443a;border-radius:999px;padding:5px 8px;color:#b9c9c0;white-space:nowrap}.team-description{margin:12px 0;color:#9eafaa;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.team-join-btn{background:#1d3026;border:1px solid #39664e;color:#a9e8c4}.teams-empty{grid-column:1/-1;text-align:center;padding:30px;color:#94a69b;border:1px dashed #34483d;border-radius:10px}@media(max-width:760px){.teams-grid{grid-template-columns:1fr}}
</style>
