<div class="tab-content">
    <h2>Yönetim Merkezi</h2>
    <p class="admin-scope-note">Bu paneldeki değişiklikler şu anda yalnızca bu cihazda saklanır; çevrim içi yönetici yetkilendirmesi bağlı değildir.</p>
    <div class="admin-section">
        <h3>Yerel profil durumu</h3>
        <div id="userList"></div>
    </div>
    <div class="admin-section">
        <h3>Haber Ekle</h3>
        <form id="addNewsForm">
            <div>
                <label for="newsTitle">Başlık</label>
                <input type="text" id="newsTitle" required>
            </div>
            <div>
                <label for="newsContent">İçerik</label>
                <textarea id="newsContent" rows="4" required></textarea>
            </div>
            <div>
                <label for="newsImage">Görsel URL (opsiyonel)</label>
                <input type="text" id="newsImage" placeholder="https://example.com/image.jpg">
            </div>
            <button type="submit">Haber Ekle</button>
        </form>
        <div id="newsAddStatus"></div>
    </div>
    <div class="admin-section">
        <h3>Eklenen Haberler (Yerel)</h3>
        <div id="adminNewsList"></div>
    </div>
</div>
<script>
    // Load users from localStorage
    function loadUsers() {
        const container = document.getElementById('userList');
        container.replaceChildren();
        const username = localStorage.getItem('apexGenesisUsername');
        const heading = document.createElement('strong');
        heading.textContent = username ? 'Aktif profil: ' + username : 'Henüz yerel profil oluşturulmadı.';
        const scope = document.createElement('p');
        scope.textContent = 'Kullanıcı hesapları, roller ve çevrim içi oturumlar için uzak backend yapılandırması gereklidir.';
        scope.style.color = '#9eafaa';
        scope.style.marginTop = '8px';
        container.append(heading, scope);
    }

    // Load admin-added news from localStorage
    function loadAdminNews() {
        let news = [];
        try {
            const stored = JSON.parse(localStorage.getItem('apexGenesisAdminNews') || '[]');
            news = Array.isArray(stored) ? stored : [];
        } catch {
            localStorage.removeItem('apexGenesisAdminNews');
        }
        const container = document.getElementById('adminNewsList');
        container.innerHTML = '';
        if (news.length === 0) {
            container.textContent = 'Henüz admin tarafından eklenmiş haber yok.';
            return;
        }
        news.forEach((item, idx) => {
            const div = document.createElement('div');
            div.style.border = '1px solid #333';
            div.style.padding = '10px';
            div.style.marginBottom = '10px';
            div.style.borderRadius = '4px';
            const imageUrl = item.image ? safeHttpUrl(item.image) : '';
            div.innerHTML = `<strong>${escapeHTML(item.title)}</strong><p>${escapeHTML(item.content)}</p>${imageUrl ? `<img src="${escapeHTML(imageUrl)}" alt="${escapeHTML(item.title)}" style="max-width:100%;margin-top:5px;border-radius:4px;">` : ''}<small>Ekleme: ${escapeHTML(new Date(item.date).toLocaleString())}</small>`;
            const removeButton = document.createElement('button');
            removeButton.type = 'button';
            removeButton.textContent = 'Duyuruyu sil';
            removeButton.style.cssText = 'margin-top:10px;padding:7px 10px;border-radius:5px;border:1px solid #57312d;background:#2a1918;color:#ffaaa0;cursor:pointer;';
            removeButton.addEventListener('click', () => {
                if (!confirm('Bu yerel duyuruyu silmek istiyor musun?')) return;
                const current = JSON.parse(localStorage.getItem('apexGenesisAdminNews') || '[]');
                current.splice(idx, 1);
                localStorage.setItem('apexGenesisAdminNews', JSON.stringify(current));
                loadAdminNews();
            });
            div.appendChild(removeButton);
            container.appendChild(div);
        });
    }

    // Add news
    document.getElementById('addNewsForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const title = document.getElementById('newsTitle').value.trim();
        const content = document.getElementById('newsContent').value.trim();
        const rawImage = document.getElementById('newsImage').value.trim();
        const image = rawImage ? safeHttpUrl(rawImage) : null;
        if (rawImage && !image) {
            document.getElementById('newsAddStatus').textContent = 'Görsel adresi geçerli bir HTTP(S) bağlantısı olmalı.';
            document.getElementById('newsAddStatus').style.color = '#ff6b6b';
            return;
        }
        if (title === '' || content === '') {
            document.getElementById('newsAddStatus').textContent = 'Başlık ve içerik zorunludur.';
            document.getElementById('newsAddStatus').style.color = '#ff6b6b';
            return;
        }
        const newsItem = {
            title,
            content,
            image,
            date: new Date().toISOString()
        };
        let adminNews = JSON.parse(localStorage.getItem('apexGenesisAdminNews') || '[]');
        adminNews.push(newsItem);
        localStorage.setItem('apexGenesisAdminNews', JSON.stringify(adminNews));
        document.getElementById('newsAddStatus').textContent = 'Haber bu cihazın yerel haber listesine eklendi.';
        document.getElementById('newsAddStatus').style.color = '#00ffcc';
        // Clear form
        this.reset();
        // Refresh admin news list
        loadAdminNews();
    });

    // Initial load
    loadUsers();
    loadAdminNews();
</script>

    @media (max-width:650px) { .admin-section { padding:17px; } #addNewsForm { grid-template-columns:minmax(0,1fr); } #addNewsForm > div:nth-child(2) { grid-column:auto; } }
</style>
