<div class="tab-content news-page">
    <div class="news-heading">
        <div><div class="section-eyebrow">OFFICIAL UPDATES</div><h2>Rocket League News</h2><p>Resmî haber akışı ve bu cihazda kaydedilen topluluk duyuruları.</p></div>
        <button id="refresh-news" class="primary-action" type="button">↻ Yenile</button>
    </div>
    <div id="news-status" class="news-status" role="status" aria-live="polite">Resmî kaynak kontrol ediliyor…</div>
    <div id="news-list" class="news-grid"></div>
</div>
<script>
    if (window.apexNewsRefreshTimer) clearInterval(window.apexNewsRefreshTimer);
    let newsRefreshTimer = null;
    let newsLoading = false;
    let lastOfficialItems = [];
    async function loadNews() {
        if (newsLoading) return;
        newsLoading = true;
        const status = document.getElementById('news-status');
        const container = document.getElementById('news-list');
        if (!status || !container) { if (newsRefreshTimer) clearInterval(newsRefreshTimer); if (window.apexNewsRefreshTimer) clearInterval(window.apexNewsRefreshTimer); window.apexNewsRefreshTimer = null; newsRefreshTimer = null; newsLoading = false; return; }
        status.textContent = 'Resmî Rocket League haberleri kontrol ediliyor…';
        status.className = 'news-status';
        try {
            const result = await window.apexAPI.fetchOfficialNews();
            if (!result.ok || !Array.isArray(result.items) || !result.items.length) throw new Error(result.status ? 'HTTP ' + result.status : 'network');
            lastOfficialItems = result.items;
            const sourceLabel = result.source === 'official-website' ? 'rocketleague.com/news' : 'Resmî Rocket League Steam duyuruları (rocketleague.com erişimi engellendi)';
            const updated = result.updatedAt ? new Date(result.updatedAt).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}) : '';
            status.textContent = result.items.length + ' resmî duyuru yüklendi · Kaynak: ' + sourceLabel + (updated ? ' · Son kontrol: ' + updated : '') + ' · 10 dakikada bir yenilenir.';
            status.classList.toggle('news-status-fallback', result.source !== 'official-website');
        } catch (error) {
            status.textContent = lastOfficialItems.length ? 'Bağlantı yenilenemedi; son başarılı haberler gösteriliyor. Otomatik yeniden deneme 10 dakikada bir yapılır.' : 'Haber kaynaklarına şu anda erişilemiyor. Örnek haber gösterilmiyor; resmî sayfayı açabilir veya daha sonra yeniden deneyebilirsin.';
            status.classList.add('news-status-warning');
        }
        const localItems = safeLocalNews();
        container.replaceChildren();
        if (localItems.length) {
            const localHeading = document.createElement('h3');
            localHeading.className = 'news-subheading';
            localHeading.textContent = 'Topluluk duyuruları · Bu cihaz';
            container.appendChild(localHeading);
            localItems.forEach(item => container.appendChild(createNewsCard(item, true)));
        }
        if (lastOfficialItems.length) {
            const officialHeading = document.createElement('h3');
            officialHeading.className = 'news-subheading';
            officialHeading.textContent = 'Resmî Rocket League haberleri';
            container.appendChild(officialHeading);
            lastOfficialItems.forEach(item => container.appendChild(createNewsCard(item, false)));
        }
        if (!localItems.length && !lastOfficialItems.length) {
            const empty = document.createElement('div');
            empty.className = 'news-empty';
            empty.innerHTML = '<strong>Şu anda görüntülenecek haber yok.</strong><p>Kaynak erişilebilir olduğunda resmî haberler burada listelenecek.</p><a href="https://www.rocketleague.com/news/" target="_blank" rel="noopener noreferrer">Rocket League resmî haber sitesini aç ↗</a>';
            container.appendChild(empty);
        }
        newsLoading = false;
        if (!newsRefreshTimer) { newsRefreshTimer = setInterval(loadNews, 10 * 60 * 1000); window.apexNewsRefreshTimer = newsRefreshTimer; }
    }

    function safeLocalNews() {
        try {
            const items = JSON.parse(localStorage.getItem('apexGenesisAdminNews') || '[]');
            return Array.isArray(items) ? items.filter(item => item && typeof item.title === 'string' && typeof item.content === 'string') : [];
        } catch {
            return [];
        }
    }

    function parseRSS(xmlText) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(xmlText, 'application/xml');
        if (doc.querySelector('parsererror')) throw new Error('RSS XML parse hatası');
        return Array.from(doc.querySelectorAll('item')).map(item => {
            const title = item.querySelector('title')?.textContent?.trim() || '';
            const description = item.querySelector('description')?.textContent?.trim() || '';
            const date = item.querySelector('pubDate')?.textContent || '';
            const link = item.querySelector('link')?.textContent?.trim() || '';
            const imageMatch = description.match(/<img[^>]+src=["']([^"']+)["']/i);
            const image = imageMatch ? safeHttpUrl(imageMatch[1]) : '';
            const cleanDescription = description.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
            return { title, content: cleanDescription, image, date, link, source: 'Rocket League' };
        }).filter(item => item.title && item.link.startsWith('https://www.rocketleague.com/'));
    }

    function createNewsCard(item, isLocal) {
        const card = document.createElement('article');
        card.className = 'news-card';
        const imageUrl = item.image ? safeHttpUrl(item.image) : '';
        if (imageUrl) {
            const image = document.createElement('img');
            image.className = 'news-image';
            image.src = imageUrl;
            image.alt = String(item.title || 'Haber görseli');
            image.loading = 'lazy';
            image.onerror = () => image.remove();
            card.appendChild(image);
        }
        const body = document.createElement('div');
        body.className = 'news-card-body';
        const label = document.createElement('span');
        label.className = 'news-source';
        label.textContent = isLocal ? 'TOPLULUK DUYURUSU · YEREL' : (item.source || 'ROCKET LEAGUE · RESMÎ').toUpperCase();
        const title = document.createElement('h3');
        title.textContent = item.title || 'Başlıksız duyuru';
        const description = document.createElement('p');
        description.textContent = item.content || '';
        const meta = document.createElement('div');
        meta.className = 'news-meta';
        const parsedDate = item.date ? new Date(item.date) : null;
        meta.textContent = parsedDate && !Number.isNaN(parsedDate.getTime()) ? parsedDate.toLocaleDateString('tr-TR') : 'Tarih belirtilmemiş';
        body.append(label, title, description, meta);
        const linkUrl = item.link ? safeHttpUrl(item.link) : '';
        if (!isLocal && linkUrl && ['www.rocketleague.com','steamcommunity.com','steamstore-a.akamaihd.net'].includes(new URL(linkUrl).hostname)) {
            const link = document.createElement('a');
            link.href = linkUrl;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = 'Haberi oku ↗';
            body.appendChild(link);
        }
        card.appendChild(body);
        return card;
    }

    document.getElementById('refresh-news').addEventListener('click', loadNews);
    loadNews();
</script>
<style>
    .news-page { display:block; }
    .news-heading { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:22px; }
    .news-heading h2 { margin-bottom:8px; }
    .news-heading p { color:#9caeab; line-height:1.6; }
    .primary-action { border:0; border-radius:8px; padding:11px 16px; background:var(--primary-color); color:#07110f; font-weight:800; cursor:pointer; transition:transform .2s,filter .2s; }
    .primary-action:hover { transform:translateY(-2px); filter:brightness(1.06); }
    .news-status { padding:13px 16px; margin-bottom:18px; border:1px solid #24443e; background:#10201d; color:#b6e7dc; border-radius:8px; }
    .news-status-warning { border-color:#5a4522; background:#211a0d; color:#f3d7a0; }
    .news-status-fallback { border-color:#3c4c57; background:#141d23; color:#c2d9e8; }
    .news-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .news-subheading { grid-column:1/-1; color:#e7efed; margin:12px 0 0; font-size:1rem; }
    .news-card { overflow:hidden; background:linear-gradient(145deg,#1a2221,#131616); border:1px solid #28312f; border-radius:12px; transition:transform .22s,border-color .22s; }
    .news-card:hover { transform:translateY(-3px); border-color:#37645b; }
    .news-image { width:100%; height:190px; object-fit:cover; display:block; background:#0b0e0d; }
    .news-card-body { padding:18px; }
    .news-source { display:inline-block; font-size:.67rem; letter-spacing:.1em; color:var(--primary-color); font-weight:800; margin-bottom:10px; }
    .news-card h3 { color:#f0f5f4; margin-bottom:10px; line-height:1.4; }
    .news-card p { color:#aab6b4; line-height:1.65; margin-bottom:14px; }
    .news-meta { color:#75827f; font-size:.8rem; margin-bottom:12px; }
    .news-card a,.news-empty a { color:var(--primary-color); font-weight:700; text-decoration:none; }
    .news-card a:hover,.news-empty a:hover { text-decoration:underline; }
    .news-empty { grid-column:1/-1; padding:32px; border:1px dashed #34423f; border-radius:12px; background:#111615; }
    .news-empty strong { color:#edf5f2; font-size:1.05rem; }
    .news-empty p { color:#9caeab; margin:10px 0 16px; line-height:1.6; }
    @media(max-width:900px) { .news-grid { grid-template-columns:1fr; } .news-heading { align-items:flex-start; flex-direction:column; } }
</style>
