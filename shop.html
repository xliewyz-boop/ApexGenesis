<div class="tab-content shop-page">
    <div class="shop-header"><div><div class="section-eyebrow">GENESIS REWARDS / LOCAL INVENTORY</div><h2>Mağaza</h2><p>Genesis Coin ile bu cihazdaki profil için kozmetik öğeler satın al.</p></div><div class="wallet-pill"><span>✧</span><div><small>BAKİYE</small><strong id="shop-balance">0 GC</strong></div></div></div>
    <div class="shop-notice">Genesis Coin ve envanter şu anda yerel profilde tutulur; bunlar çevrim içi veya gerçek para değeri olan varlıklar değildir.</div>
    <div id="shop-items" class="shop-grid"></div>
</div>
<script>
    async function loadShop() {
        try {
            const response = await fetch('data/shop.json');
            if (!response.ok) throw new Error('Mağaza kataloğu yüklenemedi.');
            const items = await response.json();
            renderShop(Array.isArray(items) ? items : []);
        } catch (error) {
            console.error(error);
            const container = document.getElementById('shop-items');
            container.textContent = 'Mağaza kataloğu yüklenemedi. Uygulamayı yeniden başlatıp tekrar dene.';
        }
    }

    function renderShop(items) {
        const container = document.getElementById('shop-items');
        const api = window.coinAPI;
        const profile = api ? api.getProfile() : { ownedItems: [], coinBalance: 0 };
        document.getElementById('shop-balance').textContent = Number(profile.coinBalance || 0).toLocaleString('tr-TR') + ' GC';
        container.replaceChildren();
        if (!items.length) {
            const empty = document.createElement('div'); empty.className = 'shop-empty'; empty.textContent = 'Şu anda katalogda ürün bulunmuyor.'; container.appendChild(empty); return;
        }
        items.forEach(item => {
            const owned = Array.isArray(profile.ownedItems) && profile.ownedItems.includes(item.id);
            const card = document.createElement('article'); card.className = 'shop-item';
            const imageUrl = safeHttpUrl(item.image || '');
            if (imageUrl) {
                const image = document.createElement('img'); image.src = imageUrl; image.alt = item.name || 'Kozmetik öğe'; image.loading = 'lazy'; image.onerror = () => image.remove(); card.appendChild(image);
            } else {
                const art = document.createElement('div'); art.className = 'shop-art'; art.textContent = String(item.name || 'AG').slice(0,2).toUpperCase(); card.appendChild(art);
            }
            const body = document.createElement('div'); body.className = 'shop-item-info';
            const type = document.createElement('span'); type.className = 'shop-item-type'; type.textContent = String(item.type || 'COSMETIC').replace(/_/g,' ').toUpperCase();
            const title = document.createElement('h3'); title.textContent = item.name || 'İsimsiz öğe';
            const description = document.createElement('p'); description.textContent = item.description || '';
            const footer = document.createElement('div'); footer.className = 'shop-item-footer';
            const price = document.createElement('strong'); price.className = 'shop-price'; price.textContent = Number(item.price || 0).toLocaleString('tr-TR') + ' GC';
            const button = document.createElement('button'); button.type = 'button'; button.className = 'buy-btn'; button.textContent = owned ? 'Envanterinde' : 'Satın al'; button.disabled = owned;
            button.addEventListener('click', () => {
                const currentApi = window.coinAPI;
                if (!currentApi) { alert('Profil verisi yüklenemedi.'); return; }
                const currentProfile = currentApi.getProfile();
                if (currentProfile.ownedItems.includes(item.id)) { renderShop(items); return; }
                const amount = Number(item.price);
                if (!Number.isFinite(amount) || amount <= 0) { alert('Bu ürünün fiyatı geçersiz; satın alma durduruldu.'); return; }
                if (!currentApi.spendCoin(amount, 'Mağaza satın alımı: ' + item.name)) { alert('Yetersiz Genesis Coin bakiyesi.'); return; }
                currentApi.addOwnedItem(item.id);
                renderShop(items);
                const balance = document.querySelector('#coin-balance, #profile-coin-balance');
                if (balance) balance.textContent = currentApi.getCoinBalance().toLocaleString('tr-TR');
                let notificationSettings = {};
                try { notificationSettings = JSON.parse(localStorage.getItem('apexGenesisSettings') || '{}'); } catch {}
                if ('Notification' in window && Notification.permission === 'granted' && notificationSettings.notificationsEnabled) {
                    new Notification('Apex Genesis', { body: item.name + ' envanterine eklendi.' });
                }
            });
            footer.append(price, button); body.append(type, title, description, footer); card.appendChild(body); container.appendChild(card);
        });
    }
    loadShop();
</script>
<style>
    .shop-page { display:block; padding:0; }
    .shop-header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:22px; }
    .shop-header p { color:#9eafaa; line-height:1.6; }
    .wallet-pill { display:flex; align-items:center; gap:12px; padding:12px 16px; border:1px solid #36564c; border-radius:10px; background:#12201c; }
    .wallet-pill > span { color:var(--primary-color); font-size:1.5rem; }
    .wallet-pill small,.wallet-pill strong { display:block; }
    .wallet-pill small { color:#78928a; font-size:.65rem; letter-spacing:.15em; }
    .wallet-pill strong { color:#eaf6f1; font:700 1rem Orbitron,monospace; margin-top:4px; }
    .shop-notice { padding:12px 15px; border:1px solid #4a3e25; border-radius:8px; background:#211b10; color:#d5bd8a; font-size:.82rem; line-height:1.6; margin-bottom:20px; }
    .shop-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
    .shop-item { overflow:hidden; border:1px solid #28332f; border-radius:12px; background:linear-gradient(145deg,#1a2220,#111514); }
    .shop-item > img,.shop-art { display:flex; align-items:center; justify-content:center; width:100%; height:190px; object-fit:cover; background:radial-gradient(circle at 50% 30%,#25453b,#111614 65%); }
    .shop-art { color:var(--primary-color); font:800 3rem Orbitron,monospace; }
    .shop-item-info { padding:18px; }
    .shop-item-type { color:var(--primary-color); font-size:.65rem; font-weight:800; letter-spacing:.12em; }
    .shop-item-info h3 { color:#edf5f1; margin:9px 0; }
    .shop-item-info p { color:#9eafaa; line-height:1.6; font-size:.86rem; min-height:42px; }
    .shop-item-footer { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:18px; }
    .shop-price { color:#e8f1ed; white-space:nowrap; }
    .buy-btn { border:0; border-radius:7px; background:var(--primary-color); color:#07110f; padding:10px 12px; font-weight:800; cursor:pointer; }
    .buy-btn:disabled { background:#273b34; color:#8aa59a; cursor:default; }
    .shop-empty { grid-column:1/-1; padding:28px; color:#9eafaa; border:1px dashed #35433e; border-radius:12px; }
    @media(max-width:1000px) { .shop-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media(max-width:650px) { .shop-grid { grid-template-columns:1fr; } .shop-header { align-items:flex-start; flex-direction:column; } }
</style>
