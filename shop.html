<div class="tab-content shop-page">
  <div class="shop-header"><div><div class="section-eyebrow">GENESIS REWARDS / CLOUD INVENTORY</div><h2>Mağaza</h2><p>Mağaza, envanter ve Genesis Coin bakiyesi Supabase hesabınla tüm cihazlarda eşitlenir.</p></div><div class="wallet-pill"><span>✧</span><div><small>ÇEVRİM İÇİ BAKİYE</small><strong id="shop-balance">— GC</strong></div></div></div>
  <div class="shop-wallet-actions"><button id="daily-reward" class="primary-action" type="button">Günlük +10 GC al</button><span id="shop-status" class="form-status" role="status"></span></div>
  <div class="shop-notice">Bakiye ve satın alma işlemleri sunucu tarafında doğrulanır. İstemci kendi kendine Genesis Coin ekleyemez veya satın alma ücretini atlayamaz.</div>
  <div id="shop-items" class="shop-grid"></div>
</div>
<script>
  let cloudShopItems=[],cloudShopOwned=new Set(),cloudShopBalance=0,cloudShopTransactions=[],cloudShopBusy='',cloudShopDisposed=false,cloudShopTimer=null,cloudShopUser=null;
  const shopStatus=text=>{const el=document.getElementById('shop-status');if(el)el.textContent=text||'';};
  function renderCloudShop(){
    const container=document.getElementById('shop-items');if(!container)return;
    document.getElementById('shop-balance').textContent=cloudShopBalance.toLocaleString('tr-TR')+' GC';
    const today=new Date().toISOString().slice(0,10);
    const claimed=cloudShopTransactions.some(tx=>tx.metadata?.reward_type==='daily'&&tx.metadata?.reward_date===today);
    const daily=document.getElementById('daily-reward');daily.disabled=claimed||Boolean(cloudShopBusy);daily.textContent=claimed?'Günlük ödül alındı ✓':'Günlük +10 GC al';
    container.replaceChildren();
    if(!cloudShopItems.length){const empty=document.createElement('div');empty.className='shop-empty';empty.textContent='Çevrim içi mağaza kataloğu boş.';container.appendChild(empty);return;}
    cloudShopItems.forEach(item=>{
      const owned=cloudShopOwned.has(item.id),card=document.createElement('article');card.className='shop-item';
      const imageUrl=window.safeHttpUrl(item.asset_url||'');
      if(imageUrl){const image=document.createElement('img');image.src=imageUrl;image.alt=item.name;image.loading='lazy';image.onerror=()=>image.remove();card.appendChild(image);}
      else{const art=document.createElement('div');art.className='shop-art';art.textContent=item.item_type==='badge'?'✦':item.item_type==='title'?'♛':String(item.name||'AG').slice(0,2).toUpperCase();card.appendChild(art);}
      const body=document.createElement('div');body.className='shop-item-info';
      const type=document.createElement('span');type.className='shop-item-type';type.textContent=String(item.item_type||'cosmetic').replace(/_/g,' ').toUpperCase();
      const title=document.createElement('h3');title.textContent=item.name;
      const desc=document.createElement('p');desc.textContent=item.description||'';
      const footer=document.createElement('div');footer.className='shop-item-footer';
      const price=document.createElement('strong');price.className='shop-price';price.textContent=Number(item.price)===0?'Ücretsiz':Number(item.price).toLocaleString('tr-TR')+' GC';
      const button=document.createElement('button');button.type='button';button.className='buy-btn';button.textContent=cloudShopBusy===item.id?'İşleniyor…':owned?'Envanterinde':'Satın al';button.disabled=owned||Boolean(cloudShopBusy);
      button.addEventListener('click',()=>purchaseCloudItem(item));
      footer.append(price,button);body.append(type,title,desc,footer);card.appendChild(body);container.appendChild(card);
    });
  }
  async function loadCloudShop(){
    try{
      const user=await window.apexCloud.getCurrentUser();if(!user){window.location.replace('login.html');return;}cloudShopUser=user;
      const [items,inventory,transactions]=await Promise.all([
        window.apexCloud.select('shop_items','select=id,name,description,item_type,price,asset_url&is_active=eq.true&order=price.asc&limit=200'),
        window.apexCloud.select('user_inventory','select=item_id&user_id=eq.'+encodeURIComponent(user.id)+'&limit=2000'),
        window.apexCloud.select('wallet_transactions','select=id,amount,reason,created_at,metadata&user_id=eq.'+encodeURIComponent(user.id)+'&order=created_at.desc&limit=2000')
      ]);
      if(cloudShopDisposed)return;
      cloudShopItems=Array.isArray(items)?items:[];cloudShopOwned=new Set((Array.isArray(inventory)?inventory:[]).map(row=>row.item_id));cloudShopTransactions=Array.isArray(transactions)?transactions:[];
      cloudShopBalance=cloudShopTransactions.reduce((sum,tx)=>sum+Number(tx.amount||0),0);
      renderCloudShop();
    }catch(error){shopStatus('Mağaza yüklenemedi: '+(error.message||'Bağlantı hatası'));}
  }
  async function purchaseCloudItem(item){
    if(!cloudShopUser||cloudShopBusy)return;cloudShopBusy=item.id;shopStatus('Satın alma güvenli şekilde işleniyor…');renderCloudShop();
    try{const result=await window.apexCloud.rpc('purchase_shop_item',{p_item_id:item.id});await loadCloudShop();shopStatus(Number(item.price)===0?'Ürün envanterine eklendi.':'Satın alma tamamlandı. Yeni bakiye: '+Number(result.balance??cloudShopBalance).toLocaleString('tr-TR')+' GC.');}
    catch(error){shopStatus('Satın alma başarısız: '+(error.message||'Bakiye veya yetki hatası'));}
    finally{cloudShopBusy='';renderCloudShop();}
  }
  document.getElementById('daily-reward').addEventListener('click',async()=>{
    if(!cloudShopUser||cloudShopBusy)return;cloudShopBusy='daily';shopStatus('Günlük ödül doğrulanıyor…');renderCloudShop();
    try{const result=await window.apexCloud.rpc('claim_daily_reward',{});await loadCloudShop();shopStatus(result.already_claimed?'Bugünkü günlük ödülü zaten aldın.':'Günlük 10 GC'+(Number(result.membership_bonus)>0?' ve '+Number(result.membership_bonus)+' GC üyelik bonusu':'')+' hesabına eklendi.');}
    catch(error){shopStatus('Günlük ödül alınamadı: '+(error.message||'Bağlantı hatası'));}
    finally{cloudShopBusy='';renderCloudShop();}
  });
  window.apexTabCleanup=()=>{cloudShopDisposed=true;if(cloudShopTimer)clearInterval(cloudShopTimer);cloudShopTimer=null;};
  loadCloudShop().then(()=>{if(!cloudShopDisposed)cloudShopTimer=setInterval(loadCloudShop,30000);});
</script>
<style>
.shop-page{min-width:0}.shop-header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.shop-header p{color:#9eafaa;margin-top:6px}.wallet-pill{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid #385345;border-radius:10px;background:#15251e;white-space:nowrap}.wallet-pill>span{color:#b6f4d7;font-size:1.5rem}.wallet-pill small,.wallet-pill strong{display:block}.wallet-pill small{color:#94b7a5;font-size:.65rem;letter-spacing:.12em}.wallet-pill strong{color:#e5fff2;font:700 1.05rem Orbitron,monospace;margin-top:4px}.shop-wallet-actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:14px 0}.primary-action{border:0;border-radius:7px;padding:10px 14px;background:var(--primary-color);color:#07110f;cursor:pointer;font-weight:800}.primary-action:disabled{opacity:.45;cursor:not-allowed}.form-status{color:#91d8c5;font-size:.82rem;min-height:1.2em}.shop-notice{padding:13px 15px;margin:16px 0 20px;border:1px solid #2e4539;border-radius:9px;background:#121b16;color:#a9c4b5;font-size:.83rem;line-height:1.6}.shop-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.shop-item{min-width:0;overflow:hidden;border:1px solid #293833;border-radius:12px;background:#151a19}.shop-item>img,.shop-art{width:100%;height:140px;object-fit:cover;background:radial-gradient(circle at 25% 20%,#245143,#101513 70%);display:grid;place-items:center;color:#a9f5d5;font:700 2.2rem Orbitron,monospace}.shop-item-info{padding:16px}.shop-item-type{font-size:.65rem;letter-spacing:.14em;color:var(--primary-color);font-weight:800}.shop-item h3{color:#edf5f1;margin-top:7px;font-size:1rem}.shop-item p{color:#9eafaa;font-size:.82rem;line-height:1.5;margin-top:8px;min-height:38px}.shop-item-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}.shop-price{color:#f3d49b;white-space:nowrap}.buy-btn{border:0;border-radius:7px;padding:9px 11px;background:var(--primary-color);color:#07110f;font-weight:800;cursor:pointer}.buy-btn:disabled{opacity:.45;cursor:not-allowed}.shop-empty{grid-column:1/-1;padding:24px;text-align:center;border:1px dashed #34443d;border-radius:12px;color:#a8b8b0}@media(max-width:950px){.shop-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.shop-grid{grid-template-columns:1fr}.shop-header{align-items:stretch;flex-direction:column}.wallet-pill{align-self:flex-start}}
</style>
