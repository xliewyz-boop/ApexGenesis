<div class="tab-content directory-page">
  <div class="directory-header">
    <div><div class="section-eyebrow">COMMUNITY / PLAYER DIRECTORY</div><h2>Oyuncular</h2><p>Supabase hesabı olan oyuncuların ortak dizini. Profil bilgileri web ve masaüstü arasında eşitlenir.</p></div>
    <span class="local-data-badge">Çevrim içi dizin</span>
  </div>
  <div class="directory-toolbar"><h3>Oyuncu dizini <span id="player-total" class="count-pill">0</span></h3><input id="player-search" type="search" placeholder="Oyuncu, rank, rol veya bölge ara…" aria-label="Oyuncu ara"></div>
  <p id="players-status" class="form-status" role="status"></p>
  <div id="players-list" class="directory-grid"></div>
</div>
<script>
  let apexPlayers = [];
  let apexPlayersTimer = null;
  let apexPlayersDisposed = false;
  function renderPlayers() {
    const container = document.getElementById('players-list');
    if (!container) return;
    const query = document.getElementById('player-search').value.trim().toLocaleLowerCase('tr-TR');
    const filtered = apexPlayers.filter(player => [player.username,player.display_name,player.rocket_league_rank,player.player_role,player.region,player.bio].join(' ').toLocaleLowerCase('tr-TR').includes(query));
    document.getElementById('player-total').textContent = String(filtered.length);
    container.replaceChildren();
    if (!filtered.length) {
      const empty = document.createElement('div'); empty.className = 'directory-empty';
      const title = document.createElement('strong'); title.textContent = apexPlayers.length ? 'Aramayla eşleşen oyuncu yok.' : 'Henüz oyuncu profili bulunamadı.';
      const detail = document.createElement('p'); detail.textContent = 'Kendi oyuncu profilini Profil sekmesinden tamamlayabilirsin.';
      empty.append(title,detail); container.appendChild(empty); return;
    }
    filtered.forEach(player => {
      const card = document.createElement('article'); card.className = 'directory-card';
      const top = document.createElement('div'); top.className = 'directory-card-top';
      const avatar = document.createElement('div'); avatar.className = 'player-mark';
      const avatarUrl = window.safeHttpUrl(player.avatar_url || '');
      if (avatarUrl) {
        const image = document.createElement('img'); image.src = avatarUrl; image.alt = ''; image.loading = 'lazy';
        image.style.cssText = 'width:100%;height:100%;border-radius:inherit;object-fit:cover';
        image.onerror = () => { image.remove(); avatar.textContent = String(player.username || 'P').slice(0,1).toUpperCase(); };
        avatar.appendChild(image);
      } else avatar.textContent = String(player.username || 'P').slice(0,1).toUpperCase();
      const rank = document.createElement('span'); rank.className = 'rank-pill'; rank.textContent = player.rocket_league_rank || 'Unranked';
      top.append(avatar,rank);
      const name = document.createElement('h3'); name.textContent = player.display_name || player.username || 'Oyuncu';
      const username = document.createElement('p'); username.textContent = '@' + (player.username || 'unknown');
      const role = document.createElement('p'); role.textContent = 'Oyun rolü · ' + (player.player_role || 'Flex');
      const region = document.createElement('p'); region.textContent = 'Bölge · ' + (player.region || 'Unknown');
      const bio = document.createElement('p'); bio.className = 'directory-meta'; bio.textContent = player.bio || 'Oyuncu henüz biyografi eklemedi.';
      card.append(top,name,username,role,region,bio); container.appendChild(card);
    });
  }
  async function loadPlayers() {
    const status = document.getElementById('players-status');
    try {
      const user = await window.apexCloud.getCurrentUser();
      if (!user) { window.location.replace('login.html'); return; }
      const rows = await window.apexCloud.select('profiles','select=id,username,display_name,bio,avatar_url,rocket_league_rank,player_role,region,created_at&order=username.asc&limit=300');
      if (apexPlayersDisposed) return;
      apexPlayers = Array.isArray(rows) ? rows : [];
      status.textContent = 'Ortak oyuncu dizini güncellendi.';
      renderPlayers();
    } catch (error) {
      if (status) status.textContent = 'Oyuncu dizini yüklenemedi: ' + (error.message || 'Bağlantı hatası');
    }
  }
  document.getElementById('player-search').addEventListener('input',renderPlayers);
  window.apexTabCleanup = () => { apexPlayersDisposed = true; if (apexPlayersTimer) clearInterval(apexPlayersTimer); apexPlayersTimer = null; };
  loadPlayers().then(() => {
    if (!apexPlayersDisposed) apexPlayersTimer = setInterval(loadPlayers,30000);
  });
</script>
<style>
.directory-page{min-width:0}.directory-header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.directory-header p{color:#9eafaa;margin-top:6px}.directory-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:22px 0 14px}.directory-toolbar h3{color:#eaf3ef}.directory-toolbar input{min-width:220px;max-width:360px;width:100%;border:1px solid #34413d;border-radius:8px;background:#0c100f;color:#edf5f1;padding:10px 12px}.count-pill,.rank-pill{border-radius:999px;background:#1d3029;color:#9fe5cb;padding:5px 9px;font-size:.72rem;font-weight:800}.directory-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.directory-card{min-width:0;padding:18px;border:1px solid #293833;border-radius:12px;background:linear-gradient(150deg,#171e1b,#101412)}.directory-card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.player-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#243d33;color:#b3f5d9;font-weight:900;overflow:hidden}.directory-card h3{color:#f0f6f3;font-size:1.05rem;overflow-wrap:anywhere}.directory-card p{color:#9eafaa;font-size:.82rem;margin-top:6px;overflow-wrap:anywhere}.directory-meta{margin-top:12px;padding-top:12px;border-top:1px solid #27332e;line-height:1.5}.directory-empty{grid-column:1/-1;border:1px dashed #34443d;border-radius:12px;padding:26px;text-align:center;color:#a8b8b0}.directory-empty p{margin-top:7px}.form-status{color:#91d8c5;font-size:.82rem;min-height:1.2em}@media(max-width:950px){.directory-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.directory-grid{grid-template-columns:1fr}.directory-header,.directory-toolbar{align-items:stretch;flex-direction:column}.directory-toolbar input{max-width:none;min-width:0}}
</style>
